[package]
name = "jsengine"
version = "0.1.0"
authors = []
edition = "2021"
build = "build.rs"

[lib]
name = "jsengine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# Exposes JSEngine.__test_panic__/1, which panics an isolate thread on
# purpose. Turned on by lib/jsengine.ex when MIX_ENV=test.
test_hooks = []

[dependencies]
rustler = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
deno_core = "0.230.0"
deno_ast = { version = "0.32", features = ["transpiling"] }
tokio = { version = "1.34.0", features = ["full"] }
quick-error = "2.0.1"
once_cell = "1.18.0"
# D54: the bundle hash that keys a startup snapshot, and the payload checksum of a stored one.
sha2 = "0.10"

[dev-dependencies]
# Process CPU time in the snapshot measurements.
libc = "0.2"
